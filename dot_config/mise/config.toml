[tools]
node = "22"
java = "temurin-21.0.12+8.0.LTS"
python = "3.13"
go = "latest"
ruby = "latest"
turbo = "latest"
cocoapods = "latest"
taplo = "latest"
"npm:oxfmt" = "0.67.0"
"npm:lint-staged" = "17.5.0"
"npm:chrome-devtools-mcp" = "1.9.0"
# 0.1.19 lacks the npm provenance present on 0.1.18; keep mise's trust checks.
"npm:@playwright/cli" = "0.1.18"

[tasks.install-codex-skill-validator-deps]
description = "Install Python packages needed for local Codex skill validation"
run = "python3 -m pip install PyYAML"

[settings.node]
corepack = true

[settings.ruby]
compile = false
